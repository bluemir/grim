<!DOCTYPE html>
<html>
    <head>
        <title>grim</title>
        {{ template "snippet/header.html" . }}
        <style>
            header {
                background-color: var(--gray-300);
            }

            html, body {
                height: 100%;
            }


            body {
                display: flex;
                flex-direction: column;
            }

            body > main {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }

            body > main > [row][grid] {
                height: 100%;
                overflow: hidden;
                align-items: stretch;
            }

            c-editor {
                width: 100%;
                height: 100%;
                box-sizing: border-box;
            }

            [col="6"]:has(c-editor) {
                overflow: hidden;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }

            .editor-toolbar {
                flex-shrink: 0;
                padding: 0.25rem 0.5rem;
                background: var(--gray-200, #eee);
                border-bottom: 1px solid var(--gray-300, #ccc);
                display: flex;
                gap: 0.25rem;
                align-items: center;
                font-size: 0.8rem;
                user-select: none;
            }

            .editor-toolbar button {
                cursor: pointer;
                padding: 0.1rem 0.4rem;
                font-size: 0.85rem;
                border: 1px solid var(--gray-400, #aaa);
                background: var(--gray-100, #f5f5f5);
                border-radius: 3px;
            }

            .editor-toolbar button:hover {
                background: var(--gray-300, #ddd);
            }

            #error-panel {
                flex-shrink: 0;
                max-height: 30%;
                overflow: auto;
                background: var(--gray-100, #f9f9f9);
                border-top: 1px solid var(--gray-300, #ccc);
                font-family: monospace;
                font-size: 0.8rem;
            }

            #error-panel[hidden] {
                display: none;
            }

            #error-panel .error-item {
                padding: 0.2rem 0.5rem;
                cursor: pointer;
                color: #c0392b;
                border-bottom: 1px solid var(--gray-200, #eee);
                white-space: pre-wrap;
            }

            #error-panel .error-item:hover {
                background: var(--gray-200, #eee);
            }

            #error-panel .error-loc {
                color: var(--gray-600, #888);
                margin-right: 0.5rem;
            }

            #svg-preview {
                position: relative;
                overflow: auto;
                height: 100%;
                min-height: 0;
                box-sizing: border-box;
            }

            #svg-preview .zoom-controls {
                position: sticky;
                top: 0;
                left: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                gap: 0.25rem;
                padding: 0.25rem 0.5rem;
                background: var(--gray-200, #eee);
                border-bottom: 1px solid var(--gray-300, #ccc);
                font-size: 0.8rem;
                user-select: none;
            }

            #svg-preview .zoom-controls button {
                cursor: pointer;
                padding: 0.1rem 0.4rem;
                font-size: 0.85rem;
                border: 1px solid var(--gray-400, #aaa);
                background: var(--gray-100, #f5f5f5);
                border-radius: 3px;
            }

            #svg-preview .zoom-controls button:hover {
                background: var(--gray-300, #ddd);
            }

            #svg-preview .svg-container {
                display: inline-block;
            }

            .resize-handle { fill: transparent; }
            .resize-handle:hover { fill: rgba(74, 144, 226, 0.25); }
            .resize-handle[data-resize-handle="n"] { cursor: n-resize; }
            .resize-handle[data-resize-handle="s"] { cursor: s-resize; }
            .resize-handle[data-resize-handle="w"] { cursor: w-resize; }
            .resize-handle[data-resize-handle="e"] { cursor: e-resize; }
            .resize-size-label {
                font-size: 11px;
                font-family: monospace;
                fill: #4a90e2;
                pointer-events: none;
                paint-order: stroke;
                stroke: white;
                stroke-width: 3px;
                stroke-linejoin: round;
            }

            /* Selected node highlight */
            .selection-outline {
                fill: none;
                stroke: #4a90e2;
                stroke-width: 3;
                pointer-events: none;
            }

            /* Selected edge highlight */
            .svg-container g[data-type='edge'].selected > polyline:nth-child(2) {
                stroke: #4a90e2 !important;
            }

            [data-anchor-handle] { opacity: 0; transition: opacity 0.1s; }
            g[data-type="edge"]:hover [data-anchor-handle] { opacity: 1; }

            body[layout=one-page] [row] {
                max-width: unset;
                margin: 0 1rem;
                padding: 0;
            }

            /* Code panel collapse */
            body[data-code-collapsed] [col="6"]:has(c-editor) {
                display: none;
            }
            body[data-code-collapsed] #svg-preview {
                grid-column: span 12;
            }
        </style>
    </head>
    <body layout="one-page">
        <header>
            <div row>
                <global-navigation-bar></global-navigation-bar>
            </div>
        </header>
        <main>
            <div row grid>
                <div col="6">
                    <div class="editor-toolbar">
                        <button id="format-btn" title="Format code (Shift+Alt+F)">Format</button>
                    </div>
                    <c-editor id="code-editor-wrapper"></c-editor>
                    <div id="error-panel" hidden></div>
                </div>
                <div col="6" id="svg-preview" tabindex="0">
                    <div class="zoom-controls">
                        <button id="toggle-code" title="Toggle code panel (Ctrl+\)">◀ Code</button>
                        <span style="border-left:1px solid var(--gray-400,#aaa);height:1rem;margin:0 0.15rem"></span>
                        <button id="zoom-out" title="Zoom out">−</button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in" title="Zoom in">+</button>
                        <button id="zoom-reset" title="Reset zoom">Reset</button>
                        <button id="zoom-fit" title="Fit to view">Fit</button>
                        <button id="export-svg" title="Export as SVG">Export SVG</button>
                        {{if (config .).StorageEnabled}}
                        <button id="short-link" title="Save and get short link">Short Link</button>
                        {{end}}
                        <button id="open-viewer" title="Open read-only viewer">Viewer</button>
                    </div>
                    <div class="svg-container" id="svg-container">
                        <!-- svg -->
                    </div>
                </div>
            </div>
        </main>
        <script src="/static/{{rev .}}/bundle/wasm/wasm_exec.js"></script>
        <script type="module">
            const editor = document.getElementById("code-editor-wrapper");
            const editorWrapper = editor;
            const preview = document.getElementById("svg-preview");
            const svgContainer = document.getElementById("svg-container");
            const errorPanel = document.getElementById("error-panel");

            // WASM 로드
            const go = new Go();
            const result = await WebAssembly.instantiateStreaming(
                fetch("/static/{{rev .}}/bundle/wasm/grim.wasm"),
                go.importObject,
            );
            go.run(result.instance);

            // --- URL data pack/unpack (deflate-raw + base64url) ---
            async function packData(str) {
                const cs = new CompressionStream("deflate-raw");
                const writer = cs.writable.getWriter();
                writer.write(new TextEncoder().encode(str));
                writer.close();
                const buf = new Uint8Array(await new Response(cs.readable).arrayBuffer());
                let bin = "";
                for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
                return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            }
            async function unpackData(token) {
                const b64 = token.replace(/-/g, "+").replace(/_/g, "/");
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const ds = new DecompressionStream("deflate-raw");
                const writer = ds.writable.getWriter();
                writer.write(bytes);
                writer.close();
                return await new Response(ds.readable).text();
            }
            async function decodeSource(enc) {
                if (enc.compressed) return await unpackData(enc.value);
                return decodeURIComponent(escape(atob(enc.value))); // legacy uncompressed
            }

            // --- Storage ID detection ---
            const storageEnabled = {{ (config .).StorageEnabled }};
            const pathMatch = window.location.pathname.match(/^\/edit\/([a-z0-9]+)$/);
            let storageId = pathMatch ? pathMatch[1] : null;
            let autoSaveTimer = null;

            // Fragment에서 data 읽기 (#z= 압축 / #data= 레거시 / ?data= 레거시)
            function getDataFromFragment() {
                const hash = window.location.hash.slice(1);
                if (hash.startsWith("z=")) {
                    return { value: hash.slice(2), compressed: true };
                }
                if (hash.startsWith("data=")) {
                    return { value: hash.slice(5), compressed: false };
                }
                const params = new URLSearchParams(window.location.search);
                const legacyData = params.get("data");
                if (legacyData) {
                    return { value: legacyData, compressed: false };
                }
                return null;
            }

            function setEncodedFragment(token) {
                history.replaceState(null, "", window.location.pathname + "#z=" + token);
            }

            // URL에서 데이터 복원 또는 Storage에서 로드
            if (storageId) {
                try {
                    const resp = await fetch(`/api/v1/storage/${storageId}`);
                    if (resp.ok) {
                        const diagram = await resp.json();
                        editor.value = diagram.source;
                    } else {
                        console.warn("Failed to load diagram from storage:", resp.status);
                    }
                } catch (e) {
                    console.warn("Failed to load diagram from storage:", e);
                }
            } else {
                const enc = getDataFromFragment();
                if (enc) {
                    try {
                        editor.value = await decodeSource(enc);
                    } catch (e) {
                        console.warn("Failed to decode data from URL:", e);
                    }
                }
            }

            // Auto-save to storage (debounced)
            function scheduleAutoSave() {
                if (!storageId) return;
                clearTimeout(autoSaveTimer);
                autoSaveTimer = setTimeout(async () => {
                    try {
                        await fetch(`/api/v1/storage/${storageId}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ source: editor.value }),
                        });
                    } catch (e) {
                        console.warn("Auto-save failed:", e);
                    }
                }, 1000);
            }

            // 파싱 에러를 에디터(gutter/밑줄)와 하단 패널에 표시
            function showDiagnostics(diags) {
                editorWrapper.setDiagnostics(diags);
                errorPanel.innerHTML = "";
                if (!diags || diags.length === 0) {
                    errorPanel.hidden = true;
                    return;
                }
                errorPanel.hidden = false;
                for (const d of diags) {
                    const item = document.createElement("div");
                    item.className = "error-item";
                    const loc = document.createElement("span");
                    loc.className = "error-loc";
                    loc.textContent = `line ${d.line}:${d.col}`;
                    item.appendChild(loc);
                    item.appendChild(document.createTextNode(d.message));
                    item.addEventListener("click", () => editorWrapper.scrollToLine(d.line));
                    errorPanel.appendChild(item);
                }
            }

            // textarea 입력 → WASM 렌더링 → SVG 표시
            let debounceTimer;
            function render() {
                const svg = grimRender(editor.value);
                svgContainer.innerHTML = svg;
                showDiagnostics(grimLint(editor.value));
                applyZoom();
                attachEdgeHandles();
                updateURL();
                // Restore selected node class after re-render
                if (selectedGroup) {
                    const id = selectedGroup.dataset.id;
                    const restored = svgContainer.querySelector(`g[data-id="${CSS.escape(id)}"]`);
                    if (restored) {
                        restored.classList.add("selected");
                        selectedGroup = restored;
                        attachResizeHandles(restored);
                    } else {
                        selectedGroup = null;
                    }
                }
                if (selectedEdge) {
                    const id = selectedEdge.dataset.id;
                    const restored = svgContainer.querySelector(`g[data-type='edge'][data-id="${CSS.escape(id)}"]`);
                    if (restored) { restored.classList.add("selected"); selectedEdge = restored; }
                    else { selectedEdge = null; }
                }
            }

            async function updateURL() {
                if (storageId) {
                    scheduleAutoSave();
                    return;
                }
                if (editor.value) {
                    setEncodedFragment(await packData(editor.value));
                } else {
                    history.replaceState(null, "", window.location.pathname);
                }
            }

            editor.addEventListener("input", () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(render, 300);
            });

            // --- Format ---

            function format() {
                editor.value = grimFormat(editor.value);
                render();
            }

            document.getElementById("format-btn").addEventListener("click", format);

            // Shift+Alt+F (VS Code standard format shortcut)
            window.addEventListener("keydown", (e) => {
                if (e.shiftKey && e.altKey && e.code === "KeyF") {
                    e.preventDefault();
                    format();
                }
            });

            // --- 줌 인/아웃 ---

            let zoomScale = 1;
            const ZOOM_STEP = 0.1;
            const ZOOM_MIN = 0.1;
            const ZOOM_MAX = 8;
            const zoomLevelEl = document.getElementById("zoom-level");

            function applyZoom() {
                const svg = svgContainer.querySelector("svg");
                if (svg) {
                    const vb = svg.viewBox.baseVal;
                    svg.setAttribute("width", Math.round(vb.width * zoomScale));
                    svg.setAttribute("height", Math.round(vb.height * zoomScale));
                }
                zoomLevelEl.textContent = `${Math.round(zoomScale * 100)}%`;
            }

            function attachEdgeHandles() {
                svgContainer.querySelectorAll("g[data-type='edge']").forEach(edgeGroup => {
                    // Waypoint circles
                    const wps = JSON.parse(edgeGroup.dataset.waypoints || "[]");
                    for (let i = 0; i < wps.length; i++) {
                        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                        circle.dataset.waypointIdx = i;
                        circle.setAttribute("cx", wps[i].x.toFixed(1));
                        circle.setAttribute("cy", wps[i].y.toFixed(1));
                        circle.setAttribute("r", "4");
                        circle.setAttribute("fill", "#4a90e2");
                        circle.setAttribute("stroke", "white");
                        circle.setAttribute("stroke-width", "1.5");
                        circle.style.cursor = "pointer";
                        edgeGroup.appendChild(circle);
                    }

                    // Anchor handles from polyline endpoints
                    const polyline = edgeGroup.querySelector("polyline:nth-child(2)");
                    if (!polyline) return;
                    const points = polyline.points;
                    if (points.length < 2) return;
                    const first = points[0];
                    const last = points[points.length - 1];

                    const fromCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    fromCircle.dataset.anchorFrom = "";
                    fromCircle.setAttribute("cx", first.x.toFixed(1));
                    fromCircle.setAttribute("cy", first.y.toFixed(1));
                    fromCircle.setAttribute("r", "5");
                    fromCircle.setAttribute("fill", "#e8801a");
                    fromCircle.setAttribute("stroke", "white");
                    fromCircle.setAttribute("stroke-width", "1.5");
                    fromCircle.dataset.anchorHandle = "";
                    fromCircle.style.cursor = "crosshair";
                    edgeGroup.appendChild(fromCircle);

                    const toCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    toCircle.dataset.anchorTo = "";
                    toCircle.setAttribute("cx", last.x.toFixed(1));
                    toCircle.setAttribute("cy", last.y.toFixed(1));
                    toCircle.setAttribute("r", "5");
                    toCircle.setAttribute("fill", "#2a9a2a");
                    toCircle.setAttribute("stroke", "white");
                    toCircle.setAttribute("stroke-width", "1.5");
                    toCircle.dataset.anchorHandle = "";
                    toCircle.style.cursor = "crosshair";
                    edgeGroup.appendChild(toCircle);
                });
            }

            function zoomTo(newScale) {
                zoomScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newScale));
                applyZoom();
            }

            // Code panel toggle
            const toggleCodeBtn = document.getElementById("toggle-code");
            function updateToggleBtn() {
                const collapsed = document.body.hasAttribute("data-code-collapsed");
                toggleCodeBtn.textContent = collapsed ? "◀ Code" : "Code ▶";
            }
            toggleCodeBtn.addEventListener("click", () => {
                document.body.toggleAttribute("data-code-collapsed");
                updateToggleBtn();
            });
            document.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === "\\") {
                    e.preventDefault();
                    document.body.toggleAttribute("data-code-collapsed");
                    updateToggleBtn();
                }
            });

            document.getElementById("zoom-in").addEventListener("click", () => {
                zoomTo(zoomScale + ZOOM_STEP);
            });

            document.getElementById("zoom-out").addEventListener("click", () => {
                zoomTo(zoomScale - ZOOM_STEP);
            });

            document.getElementById("zoom-reset").addEventListener("click", () => {
                zoomTo(1);
                preview.scrollTop = 0;
                preview.scrollLeft = 0;
            });

            document.getElementById("zoom-fit").addEventListener("click", () => {
                const svg = svgContainer.querySelector("svg");
                if (!svg) return;
                const svgW = svg.viewBox.baseVal.width || svg.getBoundingClientRect().width;
                const svgH = svg.viewBox.baseVal.height || svg.getBoundingClientRect().height;
                const containerW = preview.clientWidth;
                const containerH = preview.clientHeight;
                const fit = Math.min(containerW / svgW, containerH / svgH);
                zoomTo(fit);
            });

            // Ctrl + 마우스 휠 / 핀치로 줌 (커서 중심)
            preview.addEventListener("wheel", (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    const rect = preview.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const contentX = preview.scrollLeft + mouseX;
                    const contentY = preview.scrollTop + mouseY;
                    const oldScale = zoomScale;
                    const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
                    zoomTo(zoomScale + delta);
                    const ratio = zoomScale / oldScale;
                    preview.scrollLeft = contentX * ratio - mouseX;
                    preview.scrollTop = contentY * ratio - mouseY;
                }
            }, { passive: false });

            // --- Export SVG ---

            document.getElementById("export-svg").addEventListener("click", () => {
                const svg = svgContainer.querySelector("svg");
                if (!svg) return;

                // Clone SVG and remove editor-only elements
                const clone = svg.cloneNode(true);
                clone.querySelectorAll(
                    ".resize-handle, .selection-outline, .resize-size-label"
                ).forEach(el => el.remove());

                // Restore original size from viewBox
                const vb = svg.viewBox.baseVal;
                clone.setAttribute("width", vb.width);
                clone.setAttribute("height", vb.height);

                // Serialize with XML declaration
                const serializer = new XMLSerializer();
                const svgString = '<?xml version="1.0" encoding="UTF-8"?>\n'
                    + serializer.serializeToString(clone);

                // Download as file
                const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "diagram.svg";
                a.click();
                URL.revokeObjectURL(url);
            });

            // --- Short Link ---

            const shortLinkBtn = document.getElementById("short-link");
            if (shortLinkBtn) {
                shortLinkBtn.addEventListener("click", async () => {
                    if (!storageId) {
                        // Create new diagram
                        try {
                            const resp = await fetch("/api/v1/storage", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ source: editor.value }),
                            });
                            if (!resp.ok) throw new Error("Failed to create diagram");
                            const diagram = await resp.json();
                            storageId = diagram.id;
                            history.replaceState(null, "", `/edit/${storageId}`);
                            shortLinkBtn.textContent = "Link Copied!";
                            await navigator.clipboard.writeText(window.location.origin + `/view/${storageId}`);
                            setTimeout(() => { shortLinkBtn.textContent = "Short Link"; }, 2000);
                        } catch (e) {
                            console.error("Short link creation failed:", e);
                        }
                    } else {
                        // Copy view URL to clipboard
                        const viewUrl = window.location.origin + `/view/${storageId}`;
                        await navigator.clipboard.writeText(viewUrl);
                        shortLinkBtn.textContent = "Link Copied!";
                        setTimeout(() => { shortLinkBtn.textContent = "Short Link"; }, 2000);
                    }
                });
            }

            // --- Open Viewer ---

            document.getElementById("open-viewer").addEventListener("click", () => {
                if (storageId) {
                    window.location.href = `/view/${storageId}`;
                    return;
                }
                const url = new URL("/view", window.location.origin);
                if (window.location.hash) {
                    url.hash = window.location.hash.slice(1);
                }
                window.location.href = url.toString();
            });

            // --- WASD 부드러운 스크롤 ---

            const SCROLL_SPEED = 5;
            const pressedKeys = new Set();
            let scrollRAF = null;

            const WASD_CODES = new Set(["KeyW", "KeyA", "KeyS", "KeyD"]);

            window.addEventListener("keydown", (e) => {
                const tag = document.activeElement?.tagName;
                if (tag === "TEXTAREA" || tag === "INPUT" || document.activeElement?.closest("c-editor")) return;
                if (WASD_CODES.has(e.code) && !pressedKeys.has(e.code)) {
                    pressedKeys.add(e.code);
                    e.preventDefault();
                    if (!scrollRAF) scrollLoop();
                }
            });

            window.addEventListener("keyup", (e) => {
                pressedKeys.delete(e.code);
                if (pressedKeys.size === 0 && scrollRAF) {
                    cancelAnimationFrame(scrollRAF);
                    scrollRAF = null;
                }
            });

            function scrollLoop() {
                if (pressedKeys.has("KeyW")) preview.scrollTop -= SCROLL_SPEED;
                if (pressedKeys.has("KeyS")) preview.scrollTop += SCROLL_SPEED;
                if (pressedKeys.has("KeyA")) preview.scrollLeft -= SCROLL_SPEED;
                if (pressedKeys.has("KeyD")) preview.scrollLeft += SCROLL_SPEED;
                scrollRAF = requestAnimationFrame(scrollLoop);
            }

            // --- Arrow key fine adjustment for selected nodes/edges ---

            const ARROW_CODES = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]);

            window.addEventListener("keydown", (e) => {
                // Escape: deselect node/edge
                if (e.code === "Escape" && (selectedGroup || selectedEdge)) {
                    if (selectedGroup) { selectedGroup.classList.remove("selected"); selectedGroup = null; removeResizeHandles(); }
                    if (selectedEdge) { selectedEdge.classList.remove("selected"); selectedEdge = null; }
                    editorWrapper.removeAttribute("highlight");
                    return;
                }
                if (!ARROW_CODES.has(e.code)) return;
                const tag = document.activeElement?.tagName;
                if (tag === "TEXTAREA" || tag === "INPUT" || document.activeElement?.closest("c-editor")) return;
                if (!selectedGroup && !selectedEdge) return;

                e.preventDefault();
                const delta = e.altKey ? 1 : GRID_SIZE;
                let dx = 0, dy = 0;
                if (e.code === "ArrowUp")    dy = -delta;
                if (e.code === "ArrowDown")  dy =  delta;
                if (e.code === "ArrowLeft")  dx = -delta;
                if (e.code === "ArrowRight") dx =  delta;

                if (selectedGroup) {
                    const id = selectedGroup.dataset.id;
                    const curX = parseFloat(selectedGroup.dataset.x);
                    const curY = parseFloat(selectedGroup.dataset.y);
                    const parentGroup = selectedGroup.parentElement.closest("g[data-id]");
                    let newX, newY;
                    if (parentGroup) {
                        const px = parseFloat(parentGroup.dataset.x || 0);
                        const py = parseFloat(parentGroup.dataset.y || 0);
                        const relX = curX - px + dx;
                        const relY = curY - py - LABEL_HEIGHT + dy;
                        newX = e.altKey ? relX : snapToGrid(relX, false);
                        newY = e.altKey ? relY : snapToGrid(relY, false);
                    } else {
                        newX = e.altKey ? curX + dx : snapToGrid(curX + dx, false);
                        newY = e.altKey ? curY + dy : snapToGrid(curY + dy, false);
                    }
                    editor.value = grimSetLayout(editor.value, id, newX, newY);
                    render();
                } else if (selectedEdge) {
                    const wps = JSON.parse(selectedEdge.dataset.waypoints || "[]");
                    if (wps.length === 0) return;
                    const line = parseInt(selectedEdge.dataset.line);
                    for (const wp of wps) {
                        wp.x += dx;
                        wp.y += dy;
                    }
                    editor.value = grimSetEdgeWaypoints(editor.value, line, wps);
                    render();
                }
            });

            // --- 드래그로 노드 이동 ---

            // 마우스 좌표를 SVG viewBox 좌표로 변환
            function getSVGPoint(svg, clientX, clientY) {
                const rect = svg.getBoundingClientRect();
                const vb = svg.viewBox.baseVal;
                return {
                    x: (clientX - rect.left) * (vb.width / rect.width),
                    y: (clientY - rect.top)  * (vb.height / rect.height),
                };
            }

            const GRID_SIZE = 16;
            const MIN_NODE_W = 40;
            const MIN_NODE_H = 24;
            const HANDLE_SIZE = 8;
            const NESTED_PADDING = 16;  // must match nestedPadding in layout.go
            const LABEL_HEIGHT = 24;    // must match labelHeight in layout.go

            function snapToGrid(value, altKey) {
                if (altKey) return Math.round(value);
                return Math.round(value / GRID_SIZE) * GRID_SIZE;
            }

            // data-id 그룹 중 shape을 가진 최상위 노드 그룹 찾기
            function findNodeGroup(el) {
                while (el && el !== svgContainer) {
                    if (el.tagName === "g" && el.dataset.id && el.dataset.x !== undefined) {
                        return el;
                    }
                    el = el.parentElement;
                }
                return null;
            }

            let dragState = null;
            let waypointDragState = null;
            let anchorDragState = null;
            let resizeDragState = null;
            let selectedGroup = null;
            let selectedEdge = null;

            function attachResizeHandles(group) {
                removeResizeHandles();
                const w = parseFloat(group.dataset.w);
                const h = parseFloat(group.dataset.h);

                // Selection outline rect (visible blue border around entire node)
                const outline = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                outline.setAttribute("x", 0);
                outline.setAttribute("y", 0);
                outline.setAttribute("width", w);
                outline.setAttribute("height", h);
                outline.classList.add("selection-outline");
                group.appendChild(outline);

                const ht = HANDLE_SIZE; // hit area thickness
                // Each handle covers the full length of its side (local coords: node shape at 0,0)
                const sides = [
                    ["n", 0,           -ht/2,        w,  ht],
                    ["s", 0,           h - ht/2,     w,  ht],
                    ["e", w - ht/2,    0,            ht, h],
                    ["w", -ht/2,       0,            ht, h],
                ];
                for (const [dir, hx, hy, hw, hh] of sides) {
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.setAttribute("x", hx);
                    rect.setAttribute("y", hy);
                    rect.setAttribute("width", hw);
                    rect.setAttribute("height", hh);
                    rect.classList.add("resize-handle");
                    rect.setAttribute("data-resize-handle", dir);
                    group.appendChild(rect);
                }
            }

            function removeResizeHandles() {
                svgContainer.querySelectorAll(".resize-handle, .selection-outline").forEach(el => el.remove());
            }

            function repositionResizeHandles(group, x, y, w, h) {
                const ht = HANDLE_SIZE;
                // Handles are in local coords (node shape at 0,0)
                const positions = {
                    n: [0,           -ht/2,        w,  ht],
                    s: [0,           h - ht/2,     w,  ht],
                    e: [w - ht/2,    0,            ht, h],
                    w: [-ht/2,       0,            ht, h],
                };
                group.querySelectorAll(".resize-handle").forEach(rect => {
                    const dir = rect.dataset.resizeHandle;
                    const pos = positions[dir];
                    if (pos) {
                        rect.setAttribute("x", pos[0]);
                        rect.setAttribute("y", pos[1]);
                        rect.setAttribute("width", pos[2]);
                        rect.setAttribute("height", pos[3]);
                    }
                });
            }

            function updateResizeSizeLabel(svg, dir, newX, newY, newW, newH) {
                let label = svg.querySelector(".resize-size-label");
                if (!label) {
                    label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    label.classList.add("resize-size-label");
                    svg.appendChild(label);
                }
                let lx, ly, anchor;
                if (dir === "n") {
                    lx = newX + newW / 2; ly = newY - 8; anchor = "middle";
                } else if (dir === "s") {
                    lx = newX + newW / 2; ly = newY + newH + 16; anchor = "middle";
                } else if (dir === "e") {
                    lx = newX + newW + 8; ly = newY + newH / 2 + 4; anchor = "start";
                } else {
                    lx = newX - 8; ly = newY + newH / 2 + 4; anchor = "end";
                }
                label.setAttribute("x", lx);
                label.setAttribute("y", ly);
                label.setAttribute("text-anchor", anchor);
                label.textContent = `${Math.round(newW)} × ${Math.round(newH)}`;
            }

            function removeResizeSizeLabel() {
                svgContainer.querySelector(".resize-size-label")?.remove();
            }

            svgContainer.addEventListener("mousedown", (e) => {
                // Resize handle drag
                const resizeHandleEl = e.target.closest("[data-resize-handle]");
                if (resizeHandleEl) {
                    const group = resizeHandleEl.closest("g[data-id]");
                    const svg = svgContainer.querySelector("svg");
                    if (!group || !svg) return;
                    const resizeParentGroup = group.parentElement.closest("g[data-id]");
                    resizeDragState = {
                        svg, group,
                        dir: resizeHandleEl.dataset.resizeHandle,
                        startSVG: getSVGPoint(svg, e.clientX, e.clientY),
                        origX: parseFloat(group.dataset.x),
                        origY: parseFloat(group.dataset.y),
                        origW: parseFloat(group.dataset.w),
                        origH: parseFloat(group.dataset.h),
                        parentX: resizeParentGroup ? parseFloat(resizeParentGroup.dataset.x || 0) : null,
                        parentY: resizeParentGroup ? parseFloat(resizeParentGroup.dataset.y || 0) : null,
                    };
                    e.preventDefault(); e.stopPropagation(); return;
                }

                // Anchor handle drag (from/to connection point)
                const anchorFromEl = e.target.closest("[data-anchor-from]");
                const anchorToEl   = e.target.closest("[data-anchor-to]");
                const anchorEl = anchorFromEl || anchorToEl;
                if (anchorEl) {
                    const edgeGroup = anchorEl.closest("g[data-type='edge']");
                    if (!edgeGroup) return;
                    const svg = svgContainer.querySelector("svg");
                    if (!svg) return;
                    anchorDragState = {
                        svg, edgeGroup, anchorEl,
                        isFrom: !!anchorFromEl,
                        line: parseInt(edgeGroup.dataset.line),
                        nodeId: anchorFromEl ? edgeGroup.dataset.fromId : edgeGroup.dataset.toId,
                        startSVG: getSVGPoint(svg, e.clientX, e.clientY),
                    };
                    svg.style.cursor = "crosshair";
                    e.preventDefault(); e.stopPropagation();
                    return;
                }

                // Waypoint handle drag
                const waypointEl = e.target.closest("[data-waypoint-idx]");
                if (waypointEl) {
                    const edgeGroup = waypointEl.closest("g[data-type='edge']");
                    if (!edgeGroup) return;
                    const svg = svgContainer.querySelector("svg");
                    if (!svg) return;
                    const idx = parseInt(waypointEl.dataset.waypointIdx);
                    const wps = JSON.parse(edgeGroup.dataset.waypoints || "[]");
                    waypointDragState = {
                        svg,
                        edgeGroup,
                        waypointEl,
                        idx,
                        line: parseInt(edgeGroup.dataset.line),
                        startSVG: getSVGPoint(svg, e.clientX, e.clientY),
                        origX: wps[idx].x,
                        origY: wps[idx].y,
                        wps,
                    };
                    svg.style.cursor = "grabbing";
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }

                // Edge body click (selection)
                const edgeGroup = e.target.closest("g[data-type='edge']");
                if (edgeGroup) {
                    const svg = svgContainer.querySelector("svg");
                    if (!svg) return;
                    dragState = {
                        group: null, edgeGroup, svg,
                        startSVG: getSVGPoint(svg, e.clientX, e.clientY),
                        startClientX: e.clientX, startClientY: e.clientY,
                        origX: 0, origY: 0,
                    };
                    e.preventDefault();
                    return;
                }

                // Node drag
                const group = findNodeGroup(e.target);
                if (!group) {
                    if (selectedGroup) { selectedGroup.classList.remove("selected"); selectedGroup = null; removeResizeHandles(); }
                    if (selectedEdge) { selectedEdge.classList.remove("selected"); selectedEdge = null; }
                    editorWrapper.removeAttribute("highlight");
                    return;
                }
                const svg = svgContainer.querySelector("svg");
                if (!svg) return;

                const startPt = getSVGPoint(svg, e.clientX, e.clientY);

                const parentGroup = group.parentElement.closest("g[data-id]");
                dragState = {
                    group,
                    svg,
                    startSVG: startPt,
                    startClientX: e.clientX,
                    startClientY: e.clientY,
                    origX: parseFloat(group.dataset.x),
                    origY: parseFloat(group.dataset.y),
                    parentX: parentGroup ? parseFloat(parentGroup.dataset.x || 0) : null,
                    parentY: parentGroup ? parseFloat(parentGroup.dataset.y || 0) : null,
                };

                svg.style.cursor = "grabbing";
                e.preventDefault();
            });

            window.addEventListener("mousemove", (e) => {
                if (resizeDragState) {
                    const { svg, group, dir, startSVG, origX, origY, origW, origH } = resizeDragState;
                    const pt = getSVGPoint(svg, e.clientX, e.clientY);
                    const dx = pt.x - startSVG.x;
                    const dy = pt.y - startSVG.y;
                    let newX = origX, newY = origY, newW = origW, newH = origH;
                    if (dir === "e") {
                        newW = Math.max(MIN_NODE_W, snapToGrid(origW + dx, e.altKey));
                    } else if (dir === "s") {
                        newH = Math.max(MIN_NODE_H, snapToGrid(origH + dy, e.altKey));
                    } else if (dir === "w") {
                        newW = Math.max(MIN_NODE_W, snapToGrid(origW - dx, e.altKey));
                        newX = origX + (origW - newW);
                    } else if (dir === "n") {
                        newH = Math.max(MIN_NODE_H, snapToGrid(origH - dy, e.altKey));
                        newY = origY + (origH - newH);
                    }
                    const localX = parseFloat(group.dataset.localX || "0");
                    const localY = parseFloat(group.dataset.localY || "0");
                    group.setAttribute("transform", `translate(${localX + (newX - origX)}, ${localY + (newY - origY)})`);
                    repositionResizeHandles(group, newX, newY, newW, newH);
                    updateResizeSizeLabel(svg, dir, newX, newY, newW, newH);
                    return;
                }

                if (anchorDragState) {
                    const pt = getSVGPoint(anchorDragState.svg, e.clientX, e.clientY);
                    const ancX = parseFloat(anchorDragState.edgeGroup.dataset.ancestorX || "0");
                    const ancY = parseFloat(anchorDragState.edgeGroup.dataset.ancestorY || "0");
                    anchorDragState.anchorEl.setAttribute("cx", (pt.x - ancX).toFixed(1));
                    anchorDragState.anchorEl.setAttribute("cy", (pt.y - ancY).toFixed(1));
                    return;
                }

                if (waypointDragState) {
                    const pt = getSVGPoint(waypointDragState.svg, e.clientX, e.clientY);
                    const newX = snapToGrid(waypointDragState.origX + (pt.x - waypointDragState.startSVG.x), e.altKey);
                    const newY = snapToGrid(waypointDragState.origY + (pt.y - waypointDragState.startSVG.y), e.altKey);
                    // Move the circle handle
                    waypointDragState.waypointEl.setAttribute("cx", newX);
                    waypointDragState.waypointEl.setAttribute("cy", newY);
                    // Update all polylines in the edge group
                    waypointDragState.edgeGroup.querySelectorAll("polyline").forEach(pl => {
                        const parts = pl.getAttribute("points").trim().split(/\s+/);
                        parts[waypointDragState.idx + 1] = `${newX.toFixed(1)},${newY.toFixed(1)}`;
                        pl.setAttribute("points", parts.join(" "));
                    });
                    return;
                }

                if (!dragState) return;
                const pt = getSVGPoint(dragState.svg, e.clientX, e.clientY);
                const rawAbsX = dragState.origX + (pt.x - dragState.startSVG.x);
                const rawAbsY = dragState.origY + (pt.y - dragState.startSVG.y);
                let snapDx, snapDy;
                if (dragState.parentX !== null) {
                    const snappedRelX = snapToGrid(rawAbsX - dragState.parentX, e.altKey);
                    const snappedRelY = snapToGrid(rawAbsY - dragState.parentY - LABEL_HEIGHT, e.altKey);
                    snapDx = snappedRelX + dragState.parentX - dragState.origX;
                    snapDy = snappedRelY + dragState.parentY + LABEL_HEIGHT - dragState.origY;
                } else {
                    snapDx = snapToGrid(rawAbsX, e.altKey) - dragState.origX;
                    snapDy = snapToGrid(rawAbsY, e.altKey) - dragState.origY;
                }
                if (dragState.group) {
                    const localX = parseFloat(dragState.group.dataset.localX || "0");
                    const localY = parseFloat(dragState.group.dataset.localY || "0");
                    dragState.group.setAttribute("transform", `translate(${localX + snapDx}, ${localY + snapDy})`);
                }
            });

            window.addEventListener("mouseup", (e) => {
                if (resizeDragState) {
                    const { svg, group, dir, startSVG, origX, origY, origW, origH, parentX, parentY } = resizeDragState;
                    resizeDragState = null;
                    removeResizeSizeLabel();
                    const pt = getSVGPoint(svg, e.clientX, e.clientY);
                    const dx = pt.x - startSVG.x;
                    const dy = pt.y - startSVG.y;
                    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) { return; }
                    let newX = origX, newY = origY, newW = origW, newH = origH;
                    if (dir === "e") {
                        newW = Math.max(MIN_NODE_W, snapToGrid(origW + dx, e.altKey));
                    } else if (dir === "s") {
                        newH = Math.max(MIN_NODE_H, snapToGrid(origH + dy, e.altKey));
                    } else if (dir === "w") {
                        newW = Math.max(MIN_NODE_W, snapToGrid(origW - dx, e.altKey));
                        newX = origX + (origW - newW);
                    } else if (dir === "n") {
                        newH = Math.max(MIN_NODE_H, snapToGrid(origH - dy, e.altKey));
                        newY = origY + (origH - newH);
                    }
                    if (parentX !== null) {
                        newX -= parentX;
                        newY -= parentY + LABEL_HEIGHT;
                    }
                    const id = group.dataset.id;
                    editor.value = grimSetNodeSize(editor.value, id, Math.round(newX), Math.round(newY), Math.round(newW), Math.round(newH));
                    render();
                    const resizeLine = parseInt(group.dataset.line);
                    if (resizeLine) editorWrapper.scrollToLine(resizeLine);
                    return;
                }

                if (anchorDragState) {
                    const { svg, edgeGroup, isFrom, line, nodeId } = anchorDragState;
                    anchorDragState = null;
                    svg.style.cursor = "";

                    const pt = getSVGPoint(svg, e.clientX, e.clientY);
                    const nodeGroup = svgContainer.querySelector(`g[data-id="${CSS.escape(nodeId)}"]`);
                    if (!nodeGroup) { render(); return; }

                    const nx = parseFloat(nodeGroup.dataset.x);
                    const ny = parseFloat(nodeGroup.dataset.y);
                    const nw = parseFloat(nodeGroup.dataset.w);
                    const nh = parseFloat(nodeGroup.dataset.h);
                    const cx = nx + nw / 2, cy = ny + nh / 2;
                    const dx = pt.x - cx, dy = pt.y - cy;
                    const deg = Math.round(((Math.atan2(dx, -dy) * 180 / Math.PI) + 360) % 360);

                    const currentFrom = edgeGroup.dataset.fromAnchor || '-';
                    const currentTo   = edgeGroup.dataset.toAnchor   || '-';
                    const newFrom = isFrom ? String(deg) : currentFrom;
                    const newTo   = isFrom ? currentTo  : String(deg);

                    editor.value = grimSetEdgeAnchors(editor.value, line, newFrom, newTo);
                    render();
                    editorWrapper.scrollToLine(line);
                    return;
                }

                if (waypointDragState) {
                    const { svg, line, idx, startSVG, origX, origY, wps } = waypointDragState;
                    waypointDragState = null;
                    svg.style.cursor = "";
                    const pt = getSVGPoint(svg, e.clientX, e.clientY);
                    const newX = snapToGrid(origX + (pt.x - startSVG.x), e.altKey);
                    const newY = snapToGrid(origY + (pt.y - startSVG.y), e.altKey);
                    // 실제로 이동한 경우에만 render() — 단순 클릭이면 DOM을 유지해
                    // click 이벤트(Alt+Click 제거)가 살아있는 DOM에서 발생할 수 있게 함
                    if (Math.hypot(newX - origX, newY - origY) > 3) {
                        wps[idx] = { x: newX, y: newY };
                        editor.value = grimSetEdgeWaypoints(editor.value, line, wps);
                        render();
                        editorWrapper.scrollToLine(line);
                    }
                    return;
                }

                if (!dragState) return;
                const { group, edgeGroup, svg, startSVG, startClientX, startClientY, origX, origY, parentX, parentY } = dragState;
                dragState = null;
                svg.style.cursor = "";

                const pixelDist = Math.hypot(e.clientX - startClientX, e.clientY - startClientY);
                if (pixelDist < 5) {
                    if (edgeGroup) {
                        // Edge click: select edge, deselect node
                        if (selectedGroup) { selectedGroup.classList.remove("selected"); selectedGroup = null; removeResizeHandles(); }
                        if (selectedEdge) selectedEdge.classList.remove("selected");
                        selectedEdge = edgeGroup;
                        edgeGroup.classList.add("selected");
                        const edgeLine = parseInt(edgeGroup.dataset.line);
                        editorWrapper.scrollToLine(edgeLine);
                        editorWrapper.setAttribute("highlight", String(edgeLine));
                        preview.focus();
                    } else {
                        // Node click: select node, deselect edge
                        if (selectedEdge) { selectedEdge.classList.remove("selected"); selectedEdge = null; }
                        if (selectedGroup) selectedGroup.classList.remove("selected");
                        removeResizeHandles();
                        selectedGroup = group;
                        group.classList.add("selected");
                        attachResizeHandles(group);
                        const nodeLine = parseInt(group.dataset.line);
                        editorWrapper.scrollToLine(nodeLine);
                        editorWrapper.setAttribute("highlight", String(nodeLine));
                        preview.focus();
                    }
                    return;
                }
                if (edgeGroup) return;  // 엣지 body는 drag 없음

                const pt = getSVGPoint(svg, e.clientX, e.clientY);
                const rawX = origX + pt.x - startSVG.x;
                const rawY = origY + pt.y - startSVG.y;

                const id = group.dataset.id;
                let newX, newY;
                if (parentX !== null) {
                    newX = snapToGrid(rawX - parentX, e.altKey);
                    newY = snapToGrid(rawY - parentY - LABEL_HEIGHT, e.altKey);
                } else {
                    newX = snapToGrid(rawX, e.altKey);
                    newY = snapToGrid(rawY, e.altKey);
                }

                editor.value = grimSetLayout(editor.value, id, newX, newY);
                render();
                const dragLine = parseInt(group.dataset.line);
                if (dragLine) editorWrapper.scrollToLine(dragLine);
            });

            // 노드 위 커서 스타일
            svgContainer.addEventListener("mouseover", (e) => {
                if (e.target.closest("[data-resize-handle]")) return;
                if (dragState || waypointDragState || anchorDragState) return;
                const group = findNodeGroup(e.target);
                const svg = svgContainer.querySelector("svg");
                if (svg) svg.style.cursor = group ? "grab" : "";
            });

            // --- Alt+Click: Add/remove edge waypoints ---

            svgContainer.addEventListener("click", (e) => {
                if (!e.altKey) return;
                e.preventDefault();

                const svg = svgContainer.querySelector("svg");
                if (!svg) return;
                const pt = getSVGPoint(svg, e.clientX, e.clientY);

                // Case 1: Ctrl+Click on a waypoint circle → remove it
                const waypointEl = e.target.closest("[data-waypoint-idx]");
                if (waypointEl) {
                    const edgeGroup = waypointEl.closest("g[data-type='edge']");
                    if (!edgeGroup) return;
                    const line = parseInt(edgeGroup.dataset.line);
                    const idx = parseInt(waypointEl.dataset.waypointIdx);
                    let wps = JSON.parse(edgeGroup.dataset.waypoints || "[]");
                    wps.splice(idx, 1);
                    editor.value = grimSetEdgeWaypoints(editor.value, line, wps);
                    render();
                    editorWrapper.scrollToLine(line);
                    return;
                }

                // Case 2: Ctrl+Click on an edge → add waypoint at click position
                const edgeGroup = e.target.closest("g[data-type='edge']");
                if (!edgeGroup) return;
                const line = parseInt(edgeGroup.dataset.line);
                let wps = JSON.parse(edgeGroup.dataset.waypoints || "[]");

                const ancX = parseFloat(edgeGroup.dataset.ancestorX || "0");
                const ancY = parseFloat(edgeGroup.dataset.ancestorY || "0");
                const localPt = { x: pt.x - ancX, y: pt.y - ancY };
                const insertIdx = findInsertIndex(edgeGroup, wps, localPt);
                wps.splice(insertIdx, 0, { x: Math.round(localPt.x), y: Math.round(localPt.y) });
                editor.value = grimSetEdgeWaypoints(editor.value, line, wps);
                render();
                editorWrapper.scrollToLine(line);
            });


            function findInsertIndex(edgeGroup, wps, pt) {
                const polyline = edgeGroup.querySelector("polyline");
                if (!polyline) return wps.length;
                const pts = Array.from(polyline.points);
                if (pts.length < 2) return 0;
                let bestDist = Infinity, bestSeg = 0;
                for (let i = 0; i < pts.length - 1; i++) {
                    const d = distToSegment(pt, pts[i], pts[i + 1]);
                    if (d < bestDist) { bestDist = d; bestSeg = i; }
                }
                return bestSeg;
            }

            function distToSegment(p, a, b) {
                const dx = b.x - a.x, dy = b.y - a.y;
                if (dx === 0 && dy === 0) return Math.hypot(p.x - a.x, p.y - a.y);
                const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
                return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
            }

            // 초기 렌더링
            render();
        </script>
    </body>
</html>
