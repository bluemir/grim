<!DOCTYPE html>
<html>
    <head>
        <title>grim</title>
        {{ template "snippet/header.html" . }}
        <style>
            header {
                background-color: var(--gray-300);
            }

            html, body {
                height: 100%;
            }


            body {
                display: flex;
                flex-direction: column;
            }

            body > main {
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }

            body > main > [row][grid] {
                height: 100%;
                overflow: hidden;
                align-items: stretch;
            }

            textarea {
                width: 100%;
                height: 100%;
                min-height: unset;
                resize: none;
                field-sizing: normal;
                box-sizing: border-box;
            }

            [col="6"]:has(textarea) {
                overflow-y: auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }

            .editor-toolbar {
                flex-shrink: 0;
                padding: 0.25rem 0.5rem;
                background: var(--gray-200, #eee);
                border-bottom: 1px solid var(--gray-300, #ccc);
                display: flex;
                gap: 0.25rem;
                align-items: center;
                font-size: 0.8rem;
                user-select: none;
            }

            .editor-toolbar button {
                cursor: pointer;
                padding: 0.1rem 0.4rem;
                font-size: 0.85rem;
                border: 1px solid var(--gray-400, #aaa);
                background: var(--gray-100, #f5f5f5);
                border-radius: 3px;
            }

            .editor-toolbar button:hover {
                background: var(--gray-300, #ddd);
            }

            #svg-preview {
                position: relative;
                overflow: auto;
                height: 100%;
                min-height: 0;
                box-sizing: border-box;
            }

            #svg-preview .zoom-controls {
                position: sticky;
                top: 0;
                left: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                gap: 0.25rem;
                padding: 0.25rem 0.5rem;
                background: var(--gray-200, #eee);
                border-bottom: 1px solid var(--gray-300, #ccc);
                font-size: 0.8rem;
                user-select: none;
            }

            #svg-preview .zoom-controls button {
                cursor: pointer;
                padding: 0.1rem 0.4rem;
                font-size: 0.85rem;
                border: 1px solid var(--gray-400, #aaa);
                background: var(--gray-100, #f5f5f5);
                border-radius: 3px;
            }

            #svg-preview .zoom-controls button:hover {
                background: var(--gray-300, #ddd);
            }

            #svg-preview .svg-container {
                display: inline-block;
            }

            body[layout=one-page] [row] {
                max-width: unset;
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body layout="one-page">
        <header>
            <div row>
                <global-navigation-bar></global-navigation-bar>
            </div>
        </header>
        <main>
            <div row grid>
                <div col="6">
                    <div class="editor-toolbar">
                        <button id="format-btn" title="Format code (Shift+Alt+F)">Format</button>
                    </div>
                    <textarea id="code-editor" is="enhanced-textarea"
                        tab-size="4"
                        indent="tab"
                        submit-shortcut
                    ></textarea>
                </div>
                <div col="6" id="svg-preview" tabindex="0">
                    <div class="zoom-controls">
                        <button id="zoom-out" title="Zoom out">−</button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in" title="Zoom in">+</button>
                        <button id="zoom-reset" title="Reset zoom">Reset</button>
                        <button id="zoom-fit" title="Fit to view">Fit</button>
                    </div>
                    <div class="svg-container" id="svg-container">
                        <!-- svg -->
                    </div>
                </div>
            </div>
        </main>
        <script src="/static/{{rev .}}/bundle/wasm/wasm_exec.js"></script>
        <script type="module">
            const editor = document.getElementById("code-editor");
            const preview = document.getElementById("svg-preview");
            const svgContainer = document.getElementById("svg-container");

            // WASM 로드
            const go = new Go();
            const result = await WebAssembly.instantiateStreaming(
                fetch("/static/{{rev .}}/bundle/wasm/grim.wasm"),
                go.importObject,
            );
            go.run(result.instance);

            // URL에서 데이터 복원
            const params = new URLSearchParams(window.location.search);
            const data = params.get("data");
            if (data) {
                try {
                    editor.value = decodeURIComponent(escape(atob(data)));
                } catch (e) {
                    console.warn("Failed to decode data from URL:", e);
                }
            }

            // textarea 입력 → WASM 렌더링 → SVG 표시
            let debounceTimer;
            function render() {
                const svg = grimRender(editor.value);
                svgContainer.innerHTML = svg;
                applyZoom();
                updateURL();
            }

            function updateURL() {
                const url = new URL(window.location);
                if (editor.value) {
                    url.searchParams.set("data", btoa(unescape(encodeURIComponent(editor.value))));
                } else {
                    url.searchParams.delete("data");
                }
                history.replaceState(null, "", url);
            }

            editor.addEventListener("input", () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(render, 300);
            });

            // --- Format ---

            function format() {
                editor.value = grimFormat(editor.value);
                render();
            }

            document.getElementById("format-btn").addEventListener("click", format);

            // Shift+Alt+F (VS Code standard format shortcut)
            window.addEventListener("keydown", (e) => {
                if (e.shiftKey && e.altKey && e.code === "KeyF") {
                    e.preventDefault();
                    format();
                }
            });

            // --- 줌 인/아웃 ---

            let zoomScale = 1;
            const ZOOM_STEP = 0.1;
            const ZOOM_MIN = 0.1;
            const ZOOM_MAX = 8;
            const zoomLevelEl = document.getElementById("zoom-level");

            function applyZoom() {
                const svg = svgContainer.querySelector("svg");
                if (svg) {
                    const vb = svg.viewBox.baseVal;
                    svg.setAttribute("width", Math.round(vb.width * zoomScale));
                    svg.setAttribute("height", Math.round(vb.height * zoomScale));
                }
                zoomLevelEl.textContent = `${Math.round(zoomScale * 100)}%`;
            }

            function zoomTo(newScale) {
                zoomScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newScale));
                applyZoom();
            }

            document.getElementById("zoom-in").addEventListener("click", () => {
                zoomTo(zoomScale + ZOOM_STEP);
            });

            document.getElementById("zoom-out").addEventListener("click", () => {
                zoomTo(zoomScale - ZOOM_STEP);
            });

            document.getElementById("zoom-reset").addEventListener("click", () => {
                zoomTo(1);
                preview.scrollTop = 0;
                preview.scrollLeft = 0;
            });

            document.getElementById("zoom-fit").addEventListener("click", () => {
                const svg = svgContainer.querySelector("svg");
                if (!svg) return;
                const svgW = svg.viewBox.baseVal.width || svg.getBoundingClientRect().width;
                const svgH = svg.viewBox.baseVal.height || svg.getBoundingClientRect().height;
                const containerW = preview.clientWidth;
                const containerH = preview.clientHeight;
                const fit = Math.min(containerW / svgW, containerH / svgH);
                zoomTo(fit);
            });

            // Ctrl + 마우스 휠 / 핀치로 줌
            preview.addEventListener("wheel", (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
                    zoomTo(zoomScale + delta);
                }
            }, { passive: false });

            // --- WASD 부드러운 스크롤 ---

            const SCROLL_SPEED = 5;
            const pressedKeys = new Set();
            let scrollRAF = null;

            const WASD_CODES = new Set(["KeyW", "KeyA", "KeyS", "KeyD"]);

            window.addEventListener("keydown", (e) => {
                const tag = document.activeElement?.tagName;
                if (tag === "TEXTAREA" || tag === "INPUT") return;
                if (WASD_CODES.has(e.code) && !pressedKeys.has(e.code)) {
                    pressedKeys.add(e.code);
                    e.preventDefault();
                    if (!scrollRAF) scrollLoop();
                }
            });

            window.addEventListener("keyup", (e) => {
                pressedKeys.delete(e.code);
                if (pressedKeys.size === 0 && scrollRAF) {
                    cancelAnimationFrame(scrollRAF);
                    scrollRAF = null;
                }
            });

            function scrollLoop() {
                if (pressedKeys.has("KeyW")) preview.scrollTop -= SCROLL_SPEED;
                if (pressedKeys.has("KeyS")) preview.scrollTop += SCROLL_SPEED;
                if (pressedKeys.has("KeyA")) preview.scrollLeft -= SCROLL_SPEED;
                if (pressedKeys.has("KeyD")) preview.scrollLeft += SCROLL_SPEED;
                scrollRAF = requestAnimationFrame(scrollLoop);
            }

            // --- 드래그로 노드 이동 ---

            // 마우스 좌표를 SVG viewBox 좌표로 변환
            function getSVGPoint(svg, clientX, clientY) {
                const rect = svg.getBoundingClientRect();
                const vb = svg.viewBox.baseVal;
                return {
                    x: (clientX - rect.left) * (vb.width / rect.width),
                    y: (clientY - rect.top)  * (vb.height / rect.height),
                };
            }

            const GRID_SIZE = 16;
            function snapToGrid(value, altKey) {
                if (altKey) return Math.round(value);
                return Math.round(value / GRID_SIZE) * GRID_SIZE;
            }

            // data-id 그룹 중 shape을 가진 최상위 노드 그룹 찾기
            function findNodeGroup(el) {
                while (el && el !== svgContainer) {
                    if (el.tagName === "g" && el.dataset.id && el.dataset.x !== undefined) {
                        return el;
                    }
                    el = el.parentElement;
                }
                return null;
            }

            let dragState = null;
            let waypointDragState = null;
            let anchorDragState = null;

            svgContainer.addEventListener("mousedown", (e) => {
                // Anchor handle drag (from/to connection point)
                const anchorFromEl = e.target.closest("[data-anchor-from]");
                const anchorToEl   = e.target.closest("[data-anchor-to]");
                const anchorEl = anchorFromEl || anchorToEl;
                if (anchorEl) {
                    const edgeGroup = anchorEl.closest("g[data-type='edge']");
                    if (!edgeGroup) return;
                    const svg = svgContainer.querySelector("svg");
                    if (!svg) return;
                    anchorDragState = {
                        svg, edgeGroup, anchorEl,
                        isFrom: !!anchorFromEl,
                        line: parseInt(edgeGroup.dataset.line),
                        nodeId: anchorFromEl ? edgeGroup.dataset.fromId : edgeGroup.dataset.toId,
                        startSVG: getSVGPoint(svg, e.clientX, e.clientY),
                    };
                    svg.style.cursor = "crosshair";
                    e.preventDefault(); e.stopPropagation();
                    return;
                }

                // Waypoint handle drag
                const waypointEl = e.target.closest("[data-waypoint-idx]");
                if (waypointEl) {
                    const edgeGroup = waypointEl.closest("g[data-type='edge']");
                    if (!edgeGroup) return;
                    const svg = svgContainer.querySelector("svg");
                    if (!svg) return;
                    const idx = parseInt(waypointEl.dataset.waypointIdx);
                    const wps = JSON.parse(edgeGroup.dataset.waypoints || "[]");
                    waypointDragState = {
                        svg,
                        edgeGroup,
                        waypointEl,
                        idx,
                        line: parseInt(edgeGroup.dataset.line),
                        startSVG: getSVGPoint(svg, e.clientX, e.clientY),
                        origX: wps[idx].x,
                        origY: wps[idx].y,
                        wps,
                    };
                    svg.style.cursor = "grabbing";
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }

                // Node drag
                const group = findNodeGroup(e.target);
                if (!group) return;
                const svg = svgContainer.querySelector("svg");
                if (!svg) return;

                const startPt = getSVGPoint(svg, e.clientX, e.clientY);

                const parentGroup = group.parentElement.closest("g[data-id]");
                dragState = {
                    group,
                    svg,
                    startSVG: startPt,
                    startClientX: e.clientX,
                    startClientY: e.clientY,
                    origX: parseFloat(group.dataset.x),
                    origY: parseFloat(group.dataset.y),
                    parentX: parentGroup ? parseFloat(parentGroup.dataset.x || 0) : null,
                    parentY: parentGroup ? parseFloat(parentGroup.dataset.y || 0) : null,
                };

                svg.style.cursor = "grabbing";
                e.preventDefault();
            });

            window.addEventListener("mousemove", (e) => {
                if (anchorDragState) {
                    const pt = getSVGPoint(anchorDragState.svg, e.clientX, e.clientY);
                    anchorDragState.anchorEl.setAttribute("cx", pt.x.toFixed(1));
                    anchorDragState.anchorEl.setAttribute("cy", pt.y.toFixed(1));
                    return;
                }

                if (waypointDragState) {
                    const pt = getSVGPoint(waypointDragState.svg, e.clientX, e.clientY);
                    const newX = snapToGrid(waypointDragState.origX + (pt.x - waypointDragState.startSVG.x), e.altKey);
                    const newY = snapToGrid(waypointDragState.origY + (pt.y - waypointDragState.startSVG.y), e.altKey);
                    // Move the circle handle
                    waypointDragState.waypointEl.setAttribute("cx", newX);
                    waypointDragState.waypointEl.setAttribute("cy", newY);
                    // Update all polylines in the edge group
                    waypointDragState.edgeGroup.querySelectorAll("polyline").forEach(pl => {
                        const parts = pl.getAttribute("points").trim().split(/\s+/);
                        parts[waypointDragState.idx + 1] = `${newX.toFixed(1)},${newY.toFixed(1)}`;
                        pl.setAttribute("points", parts.join(" "));
                    });
                    return;
                }

                if (!dragState) return;
                const pt = getSVGPoint(dragState.svg, e.clientX, e.clientY);
                const rawAbsX = dragState.origX + (pt.x - dragState.startSVG.x);
                const rawAbsY = dragState.origY + (pt.y - dragState.startSVG.y);
                let snapDx, snapDy;
                if (dragState.parentX !== null) {
                    const snappedRelX = snapToGrid(rawAbsX - dragState.parentX, e.altKey);
                    const snappedRelY = snapToGrid(rawAbsY - dragState.parentY, e.altKey);
                    snapDx = snappedRelX + dragState.parentX - dragState.origX;
                    snapDy = snappedRelY + dragState.parentY - dragState.origY;
                } else {
                    snapDx = snapToGrid(rawAbsX, e.altKey) - dragState.origX;
                    snapDy = snapToGrid(rawAbsY, e.altKey) - dragState.origY;
                }
                dragState.group.setAttribute("transform", `translate(${snapDx}, ${snapDy})`);
            });

            window.addEventListener("mouseup", (e) => {
                if (anchorDragState) {
                    const { svg, edgeGroup, isFrom, line, nodeId } = anchorDragState;
                    anchorDragState = null;
                    svg.style.cursor = "";

                    const pt = getSVGPoint(svg, e.clientX, e.clientY);
                    const nodeGroup = svgContainer.querySelector(`g[data-id="${CSS.escape(nodeId)}"]`);
                    if (!nodeGroup) { render(); return; }

                    const nx = parseFloat(nodeGroup.dataset.x);
                    const ny = parseFloat(nodeGroup.dataset.y);
                    const nw = parseFloat(nodeGroup.dataset.w);
                    const nh = parseFloat(nodeGroup.dataset.h);
                    const cx = nx + nw / 2, cy = ny + nh / 2;
                    const dx = pt.x - cx, dy = pt.y - cy;
                    const deg = Math.round(((Math.atan2(dx, -dy) * 180 / Math.PI) + 360) % 360);

                    const currentFrom = edgeGroup.dataset.fromAnchor || '-';
                    const currentTo   = edgeGroup.dataset.toAnchor   || '-';
                    const newFrom = isFrom ? String(deg) : currentFrom;
                    const newTo   = isFrom ? currentTo  : String(deg);

                    editor.value = grimSetEdgeAnchors(editor.value, line, newFrom, newTo);
                    render();
                    return;
                }

                if (waypointDragState) {
                    const { svg, line, idx, startSVG, origX, origY, wps } = waypointDragState;
                    waypointDragState = null;
                    svg.style.cursor = "";
                    const pt = getSVGPoint(svg, e.clientX, e.clientY);
                    const newX = snapToGrid(origX + (pt.x - startSVG.x), e.altKey);
                    const newY = snapToGrid(origY + (pt.y - startSVG.y), e.altKey);
                    // 실제로 이동한 경우에만 render() — 단순 클릭이면 DOM을 유지해
                    // click 이벤트(Alt+Click 제거)가 살아있는 DOM에서 발생할 수 있게 함
                    if (Math.hypot(newX - origX, newY - origY) > 3) {
                        wps[idx] = { x: newX, y: newY };
                        editor.value = grimSetEdgeWaypoints(editor.value, line, wps);
                        render();
                    }
                    return;
                }

                if (!dragState) return;
                const { group, svg, startSVG, startClientX, startClientY, origX, origY, parentX, parentY } = dragState;
                dragState = null;
                svg.style.cursor = "";

                const pixelDist = Math.hypot(e.clientX - startClientX, e.clientY - startClientY);
                if (pixelDist < 5) {
                    // Click (not drag): navigate textarea cursor to declaration line
                    const line = parseInt(group.dataset.line);
                    navigateToLine(editor, line);
                    return;
                }

                const pt = getSVGPoint(svg, e.clientX, e.clientY);
                const rawX = origX + pt.x - startSVG.x;
                const rawY = origY + pt.y - startSVG.y;

                const id = group.dataset.id;
                let newX, newY;
                if (parentX !== null) {
                    newX = snapToGrid(rawX - parentX, e.altKey);
                    newY = snapToGrid(rawY - parentY, e.altKey);
                } else {
                    newX = snapToGrid(rawX, e.altKey);
                    newY = snapToGrid(rawY, e.altKey);
                }

                editor.value = grimSetLayout(editor.value, id, newX, newY);
                render();
            });

            // 노드 위 커서 스타일
            svgContainer.addEventListener("mouseover", (e) => {
                if (dragState || waypointDragState || anchorDragState) return;
                const group = findNodeGroup(e.target);
                const svg = svgContainer.querySelector("svg");
                if (svg) svg.style.cursor = group ? "grab" : "";
            });

            // --- Alt+Click: Add/remove edge waypoints ---

            svgContainer.addEventListener("click", (e) => {
                if (!e.altKey) return;
                e.preventDefault();

                const svg = svgContainer.querySelector("svg");
                if (!svg) return;
                const pt = getSVGPoint(svg, e.clientX, e.clientY);

                // Case 1: Ctrl+Click on a waypoint circle → remove it
                const waypointEl = e.target.closest("[data-waypoint-idx]");
                if (waypointEl) {
                    const edgeGroup = waypointEl.closest("g[data-type='edge']");
                    if (!edgeGroup) return;
                    const line = parseInt(edgeGroup.dataset.line);
                    const idx = parseInt(waypointEl.dataset.waypointIdx);
                    let wps = JSON.parse(edgeGroup.dataset.waypoints || "[]");
                    wps.splice(idx, 1);
                    editor.value = grimSetEdgeWaypoints(editor.value, line, wps);
                    render();
                    return;
                }

                // Case 2: Ctrl+Click on an edge → add waypoint at click position
                const edgeGroup = e.target.closest("g[data-type='edge']");
                if (!edgeGroup) return;
                const line = parseInt(edgeGroup.dataset.line);
                let wps = JSON.parse(edgeGroup.dataset.waypoints || "[]");

                const insertIdx = findInsertIndex(edgeGroup, wps, pt);
                wps.splice(insertIdx, 0, { x: Math.round(pt.x), y: Math.round(pt.y) });
                editor.value = grimSetEdgeWaypoints(editor.value, line, wps);
                render();
            });

            function navigateToLine(textarea, lineNumber) {
                const lines = textarea.value.split('\n');
                if (lineNumber < 1 || lineNumber > lines.length) return;
                let pos = 0;
                for (let i = 0; i < lineNumber - 1; i++) {
                    pos += lines[i].length + 1;
                }
                const lineLen = lines[lineNumber - 1].length;
                textarea.focus();
                textarea.setSelectionRange(pos, pos + lineLen);
            }

            function findInsertIndex(edgeGroup, wps, pt) {
                const polyline = edgeGroup.querySelector("polyline");
                if (!polyline) return wps.length;
                const pts = Array.from(polyline.points);
                if (pts.length < 2) return 0;
                let bestDist = Infinity, bestSeg = 0;
                for (let i = 0; i < pts.length - 1; i++) {
                    const d = distToSegment(pt, pts[i], pts[i + 1]);
                    if (d < bestDist) { bestDist = d; bestSeg = i; }
                }
                return bestSeg;
            }

            function distToSegment(p, a, b) {
                const dx = b.x - a.x, dy = b.y - a.y;
                if (dx === 0 && dy === 0) return Math.hypot(p.x - a.x, p.y - a.y);
                const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy)));
                return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
            }

            // 초기 렌더링
            render();
        </script>
    </body>
</html>
