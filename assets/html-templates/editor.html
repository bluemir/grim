<!DOCTYPE html>
<html>
    <head>
        <title>grim</title>
        {{ template "snippet/header.html" . }}
        <style>
            header {
                background-color: var(--gray-300);
            }

            textarea {
                width: 100%;
                min-height: 20rem;
                resize: vertical;
                field-sizing: content;
            }

            #svg-preview {
                position: relative;
                overflow: auto;
            }

            #svg-preview .zoom-controls {
                position: sticky;
                top: 0;
                left: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                gap: 0.25rem;
                padding: 0.25rem 0.5rem;
                background: var(--gray-200, #eee);
                border-bottom: 1px solid var(--gray-300, #ccc);
                font-size: 0.8rem;
                user-select: none;
            }

            #svg-preview .zoom-controls button {
                cursor: pointer;
                padding: 0.1rem 0.4rem;
                font-size: 0.85rem;
                border: 1px solid var(--gray-400, #aaa);
                background: var(--gray-100, #f5f5f5);
                border-radius: 3px;
            }

            #svg-preview .zoom-controls button:hover {
                background: var(--gray-300, #ddd);
            }

            #svg-preview .svg-container {
                transform-origin: 0 0;
                display: inline-block;
                min-width: 100%;
                min-height: 100%;
            }
        </style>
    </head>
    <body layout="one-page">
        <header>
            <div row>
                <global-navigation-bar></global-navigation-bar>
            </div>
        </header>
        <main>
            <div row grid>
                <div col="6">
                    <textarea id="code-editor" is="enhanced-textarea"
                        tab-size="4"
                        indent="tab"
                        submit-shortcut
                    ></textarea>
                </div>
                <div col="6" id="svg-preview" tabindex="0">
                    <div class="zoom-controls">
                        <button id="zoom-out" title="Zoom out">−</button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in" title="Zoom in">+</button>
                        <button id="zoom-reset" title="Reset zoom">Reset</button>
                        <button id="zoom-fit" title="Fit to view">Fit</button>
                    </div>
                    <div class="svg-container" id="svg-container">
                        <!-- svg -->
                    </div>
                </div>
            </div>
        </main>
        <script src="/static/{{rev .}}/bundle/wasm/wasm_exec.js"></script>
        <script type="module">
            const editor = document.getElementById("code-editor");
            const preview = document.getElementById("svg-preview");
            const svgContainer = document.getElementById("svg-container");

            // WASM 로드
            const go = new Go();
            const result = await WebAssembly.instantiateStreaming(
                fetch("/static/{{rev .}}/bundle/wasm/grim.wasm"),
                go.importObject,
            );
            go.run(result.instance);

            // URL에서 데이터 복원
            const params = new URLSearchParams(window.location.search);
            const data = params.get("data");
            if (data) {
                try {
                    editor.value = decodeURIComponent(escape(atob(data)));
                } catch (e) {
                    console.warn("Failed to decode data from URL:", e);
                }
            }

            // textarea 입력 → WASM 렌더링 → SVG 표시
            let debounceTimer;
            function render() {
                const svg = grimRender(editor.value);
                svgContainer.innerHTML = svg;
                updateURL();
            }

            function updateURL() {
                const url = new URL(window.location);
                if (editor.value) {
                    url.searchParams.set("data", btoa(unescape(encodeURIComponent(editor.value))));
                } else {
                    url.searchParams.delete("data");
                }
                history.replaceState(null, "", url);
            }

            editor.addEventListener("input", () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(render, 300);
            });

            // --- 줌 인/아웃 ---

            let zoomScale = 1;
            const ZOOM_STEP = 0.1;
            const ZOOM_MIN = 0.1;
            const ZOOM_MAX = 5;
            const zoomLevelEl = document.getElementById("zoom-level");

            function applyZoom() {
                svgContainer.style.transform = `scale(${zoomScale})`;
                zoomLevelEl.textContent = `${Math.round(zoomScale * 100)}%`;
            }

            function zoomTo(newScale) {
                zoomScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newScale));
                applyZoom();
            }

            document.getElementById("zoom-in").addEventListener("click", () => {
                zoomTo(zoomScale + ZOOM_STEP);
            });

            document.getElementById("zoom-out").addEventListener("click", () => {
                zoomTo(zoomScale - ZOOM_STEP);
            });

            document.getElementById("zoom-reset").addEventListener("click", () => {
                zoomTo(1);
                preview.scrollTop = 0;
                preview.scrollLeft = 0;
            });

            document.getElementById("zoom-fit").addEventListener("click", () => {
                const svg = svgContainer.querySelector("svg");
                if (!svg) return;
                const svgW = svg.viewBox.baseVal.width || svg.getBoundingClientRect().width;
                const svgH = svg.viewBox.baseVal.height || svg.getBoundingClientRect().height;
                const containerW = preview.clientWidth;
                const containerH = preview.clientHeight;
                const fit = Math.min(containerW / svgW, containerH / svgH, 1);
                zoomTo(fit);
            });

            // Shift + 마우스 휠로 줌
            preview.addEventListener("wheel", (e) => {
                if (e.shiftKey) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
                    zoomTo(zoomScale + delta);
                }
            }, { passive: false });

            // --- WASD 부드러운 스크롤 ---

            const SCROLL_SPEED = 5;
            const pressedKeys = new Set();
            let scrollRAF = null;

            const WASD_CODES = new Set(["KeyW", "KeyA", "KeyS", "KeyD"]);

            window.addEventListener("keydown", (e) => {
                const tag = document.activeElement?.tagName;
                if (tag === "TEXTAREA" || tag === "INPUT") return;
                if (WASD_CODES.has(e.code) && !pressedKeys.has(e.code)) {
                    pressedKeys.add(e.code);
                    e.preventDefault();
                    if (!scrollRAF) scrollLoop();
                }
            });

            window.addEventListener("keyup", (e) => {
                pressedKeys.delete(e.code);
                if (pressedKeys.size === 0 && scrollRAF) {
                    cancelAnimationFrame(scrollRAF);
                    scrollRAF = null;
                }
            });

            function scrollLoop() {
                if (pressedKeys.has("KeyW")) preview.scrollTop -= SCROLL_SPEED;
                if (pressedKeys.has("KeyS")) preview.scrollTop += SCROLL_SPEED;
                if (pressedKeys.has("KeyA")) preview.scrollLeft -= SCROLL_SPEED;
                if (pressedKeys.has("KeyD")) preview.scrollLeft += SCROLL_SPEED;
                scrollRAF = requestAnimationFrame(scrollLoop);
            }

            // --- 드래그로 노드 이동 ---

            // 마우스 좌표를 SVG viewBox 좌표로 변환
            function getSVGPoint(svg, clientX, clientY) {
                const rect = svg.getBoundingClientRect();
                const vb = svg.viewBox.baseVal;
                return {
                    x: (clientX - rect.left) * (vb.width / rect.width),
                    y: (clientY - rect.top)  * (vb.height / rect.height),
                };
            }

            // data-id 그룹 중 rect를 가진 최상위 노드 그룹 찾기
            function findNodeGroup(el) {
                while (el && el !== svgContainer) {
                    if (el.tagName === "g" && el.dataset.id && el.querySelector(":scope > rect")) {
                        return el;
                    }
                    el = el.parentElement;
                }
                return null;
            }

            let dragState = null;

            svgContainer.addEventListener("mousedown", (e) => {
                const group = findNodeGroup(e.target);
                if (!group) return;
                const svg = svgContainer.querySelector("svg");
                if (!svg) return;

                const rect = group.querySelector(":scope > rect");
                const startPt = getSVGPoint(svg, e.clientX, e.clientY);

                dragState = {
                    group,
                    svg,
                    startSVG: startPt,
                    origX: parseFloat(rect.getAttribute("x")),
                    origY: parseFloat(rect.getAttribute("y")),
                };

                svg.style.cursor = "grabbing";
                e.preventDefault();
            });

            window.addEventListener("mousemove", (e) => {
                if (!dragState) return;
                const pt = getSVGPoint(dragState.svg, e.clientX, e.clientY);
                const dx = pt.x - dragState.startSVG.x;
                const dy = pt.y - dragState.startSVG.y;
                dragState.group.setAttribute("transform", `translate(${dx}, ${dy})`);
            });

            window.addEventListener("mouseup", (e) => {
                if (!dragState) return;
                const { group, svg, startSVG, origX, origY } = dragState;
                dragState = null;
                svg.style.cursor = "";

                const pt = getSVGPoint(svg, e.clientX, e.clientY);
                let newX = Math.round(origX + pt.x - startSVG.x);
                let newY = Math.round(origY + pt.y - startSVG.y);

                const id = group.dataset.id;
                const line = parseInt(group.dataset.line, 10);

                // 중첩 노드: 부모의 절대 좌표를 빼서 상대 좌표로 변환
                const parentGroup = group.parentElement.closest("g[data-id]");
                if (parentGroup) {
                    const parentRect = parentGroup.querySelector(":scope > rect");
                    if (parentRect) {
                        newX -= parseFloat(parentRect.getAttribute("x"));
                        newY -= parseFloat(parentRect.getAttribute("y"));
                    }
                }

                updateNodeLayout(id, line, newX, newY);
                render();
            });

            // 노드 위 커서 스타일
            svgContainer.addEventListener("mouseover", (e) => {
                if (dragState) return;
                const group = findNodeGroup(e.target);
                const svg = svgContainer.querySelector("svg");
                if (svg) svg.style.cursor = group ? "grab" : "";
            });

            // 소스 텍스트에 @layout 반영
            function updateNodeLayout(id, line, newX, newY) {
                const lines = editor.value.split("\n");
                const lineIdx = line - 1;

                const layoutStr = `@layout { x: ${newX}, y: ${newY} }`;

                // 암시적 노드: 소스에 선언이 없으므로 새로 삽입
                if (lineIdx < 0) {
                    const dotIdx = id.lastIndexOf(".");
                    if (dotIdx !== -1) {
                        // 중첩 암시적 노드 — 부모 블록 안에 삽입
                        const parentID = id.substring(0, dotIdx);
                        const localName = id.substring(dotIdx + 1);
                        const parentGroup = svgContainer.querySelector(`g[data-id="${parentID}"]`);
                        if (parentGroup) {
                            const parentLine = parseInt(parentGroup.dataset.line, 10);
                            const parentIdx = parentLine - 1;
                            for (let i = parentIdx; i < Math.min(parentIdx + 3, lines.length); i++) {
                                if (lines[i].includes("{")) {
                                    lines.splice(i + 1, 0, `\t${localName}: {`, `\t\t${layoutStr}`, `\t}`);
                                    editor.value = lines.join("\n");
                                    return;
                                }
                            }
                        }
                    }
                    // 최상위 암시적 노드 — 소스 끝에 추가
                    lines.push(`${id}: {`, `\t${layoutStr}`, `}`);
                    editor.value = lines.join("\n");
                    return;
                }

                if (lineIdx >= lines.length) return;

                // Case 1: 이미 @layout이 있는 경우 — 블록 닫힘(})까지 탐색
                for (let i = lineIdx; i < lines.length; i++) {
                    if (/^\s*@layout\s*\{/.test(lines[i])) {
                        lines[i] = lines[i].replace(/@layout\s*\{[^}]*\}/, layoutStr);
                        editor.value = lines.join("\n");
                        return;
                    }
                    if (i > lineIdx && /^\s*\}/.test(lines[i])) break;
                }

                // Case 2: 블록이 있는 경우 — { 다음 줄에 삽입
                for (let i = lineIdx; i < Math.min(lineIdx + 3, lines.length); i++) {
                    if (lines[i].includes("{")) {
                        lines.splice(i + 1, 0, `\t${layoutStr}`);
                        editor.value = lines.join("\n");
                        return;
                    }
                }

                // Case 3: 블록 없는 노드 — 줄 끝에 블록 추가
                lines[lineIdx] = lines[lineIdx].trimEnd() + ` { ${layoutStr} }`;
                editor.value = lines.join("\n");
            }

            // 초기 렌더링
            render();
        </script>
    </body>
</html>
